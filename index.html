<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FastForward Logistics internal operations dashboard — real-time shipment KPIs, regional performance, and exception tracking." />
  <meta name="robots" content="noindex" />
  <title>FastForward Logistics — Operations Dashboard</title>

  <!-- Apply stored theme before Vue mounts to prevent flash of wrong theme -->
  <script>
    (function () {
      var stored = localStorage.getItem('ff-theme')
      var theme = stored === 'dark' || stored === 'light'
        ? stored
        : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      document.documentElement.setAttribute('data-theme', theme)
    })()
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
